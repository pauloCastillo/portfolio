# Nginx L7 para Render (servicio Docker único: nginx :$PORT -> uvicorn 127.0.0.1:8000).
# `start.sh` sustituye `listen 8080` por `$PORT` y retira el bloque DOCS_DENY
# salvo que ENABLE_DOCS=false (prod). Verificación local: `nginx -t -c api/nginx.conf`.

user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;

    # El exceso de rate-limit debe ser 429 (default nginx: 503).
    limit_req_status 429;

    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    # Nginx no expresa r/h: el proxy corta a 1r/m y la app (slowapi) aplica 3/h.
    limit_req_zone $binary_remote_addr zone=forgot:1m rate=1r/m;
    limit_req_zone $binary_remote_addr zone=general:1m rate=100r/m;

    # Default duro: solo el upload admite cuerpo grande (ver location).
    client_max_body_size 1m;
    client_body_temp_path /tmp/nginx-body;

    upstream backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 8080;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Normaliza el 429 de ambas capas (nginx y slowapi) con Retry-After.
        error_page 429 @too_many;
        location @too_many {
            add_header Retry-After 60 always;
            default_type application/json;
            return 429 '{"detail":"Too many requests"}';
        }

        # DOCS_DENY_BEGIN
        location ~ ^/api/(docs|redoc|openapi\.json) {
            return 404;
        }
        # DOCS_DENY_END

        location = /api/v1/auth/login {
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/forgot-password {
            limit_req zone=forgot burst=1 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/projects/upload/image {
            client_max_body_size 31m;
            limit_req zone=general burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering on;
        }

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
